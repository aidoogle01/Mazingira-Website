<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TripCard</title>
<style>body{margin:0;background:var(--surface);} .wrap{padding:24px;}</style></head>
<body class="mz"><div class="wrap">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px;max-width:900px">
  <a class="mz-trip" href="#savannah-to-shore">
    <img class="mz-trip__img" src="/_blob/bb6cb62f432a1841d7cd01961895829d" alt="A herd of elephants walking through dry grass in Tarangire">
    <h3 class="mz-trip__title">Luxury Savannah to Shore</h3>
    <p class="mz-trip__summary">Nine days: Tarangire, Ngorongoro Crater and the Serengeti, then three nights on Zanzibar.</p>
    <p class="mz-trip__price"><span class="mz-price">From $5,699</span><span class="mz-small">per person</span></p>
  </a>
  <a class="mz-trip" href="#serengeti-under-the-stars">
    <img class="mz-trip__img" src="/_blob/7358a0dfc2776546d93de2f573808599" alt="A canvas safari tent under acacia trees">
    <h3 class="mz-trip__title">Serengeti Under the Stars</h3>
    <p class="mz-trip__summary">Seven days camping through Tarangire, the Serengeti, Ndutu, Ngorongoro and Lake Manyara.</p>
    <p class="mz-trip__price"><span class="mz-price">From $2,199</span><span class="mz-small">per person</span></p>
  </a>
</div>
</div>
</body>
</html>
